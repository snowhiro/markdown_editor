[project]
name = "markdown-editor"
version = "0.1.0"
description = "Cross-platform Markdown editor with Preview / WYSIWYG / Edit modes"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.8",
    # Excel → Markdown 変換（spec.md 11章）
    "openpyxl>=3.1",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
markdown-editor = "markdown_editor.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
markdown_editor = ["web/**/*"]
